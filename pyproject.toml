[project]
name = "ceu-trader-intelligence"
version = "0.1.0"
description = "Paper-trading lab with independent strategies and deterministic risk supervision"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "tzdata>=2024.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
